name: Sync School Calendar

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch calendar
        run: |
          curl -sSL --compressed \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: text/calendar,text/plain,*/*" \
            -w "HTTP %{http_code}, type %{content_type}\n" \
            "https://ltms.ltisdschools.org/calendar/calendar_396.ics" \
            -o calendar.ics.new
          echo "--- first part of response ---"
          head -c 400 calendar.ics.new
          echo
          echo "------------------------------"
          if [ ! -s calendar.ics.new ]; then
            echo "Fetch returned an empty file - aborting"
            exit 1
          fi
          if ! grep -q "BEGIN:VCALENDAR" calendar.ics.new; then
            echo "Fetched file doesn't look like calendar data - aborting"
            exit 1
          fi
          mv calendar.ics.new calendar.ics

      - name: Commit if changed
        run: |
          git config user.name "calendar-sync-bot"
          git config user.email "actions@github.com"
          git add calendar.ics
          if git diff --cached --quiet; then
            echo "No changes since last sync"
          else
            git commit -m "Sync calendar $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
